<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jedi (codename): Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Jedi prototype v2, single-file, dependency-free (fonts optional).
   Styled to jedi-design/identity.md: ink primary + violet accent,
   Inter, SVG line icons (no emoji), category -> providers IA.
   Categories fully built: Rides + Grocery.
   ============================================================ */
:root{
  --btn-bg:#15131F; --btn-fg:#FFFFFF;
  --violet:#6C4DF6; --violet-tint:#F2EEFE;
  --savings:#0E9F6E; --savings-tint:#E8F6F0;
  --warn:#B45309; --warn-tint:#FBF1E4; --danger:#DC2626; --danger-tint:#FCEBEB;
  --text:#1C1A26; --muted:#6E6B7B;
  --bg:#FAFAFB; --card:#FFFFFF; --border:#EAEAEF; --track:#F0F0F3;
  --shadow-card:0 1px 2px rgba(20,16,40,.05), 0 2px 8px rgba(20,16,40,.04);
  --shadow-raised:0 12px 32px rgba(20,16,40,.16);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
.dark .phone{
  --btn-bg:#FFFFFF; --btn-fg:#15131F; --violet:#8B73FF; --violet-tint:#241E3D;
  --savings-tint:#10271F; --warn-tint:#2A2110; --danger-tint:#2E1517;
  --text:#F4F4F7; --muted:#9A98A8; --bg:#0E0E12; --card:#18181F; --border:#2A2A33; --track:#222029;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font); color:var(--text); background:#EDEDF1;
  background-image:radial-gradient(1100px 560px at 50% -8%, #e6e3f2 0%, #EDEDF1 58%);
  display:flex; flex-direction:column; align-items:center; min-height:100%; letter-spacing:-.01em;
}

/* toolbar (outside phone) */
.toolbar{width:100%; display:flex; gap:10px; align-items:center; justify-content:center; padding:14px 16px; flex-wrap:wrap}
.toolbar .brand{font-weight:800; margin-right:6px; color:#211d33; display:flex; align-items:center; gap:8px}
.toolbar .brand small{font-weight:500; color:#807b93}
.tbtn{border:1px solid #dad6e6; background:#fff; color:#3a3454; font-family:var(--font); font-weight:600; font-size:13px; padding:8px 12px; border-radius:9px; cursor:pointer}
.tbtn:hover{border-color:var(--violet); color:var(--violet)}
select.tbtn{padding-right:8px}

/* phone */
.stage{padding:8px 16px 40px}
.phone{
  position:relative; width:390px; height:844px; background:var(--bg); color:var(--text);
  border-radius:46px; border:11px solid #131119; overflow:hidden;
  box-shadow:0 30px 70px rgba(25,18,55,.32); display:flex; flex-direction:column;
}
.notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:148px; height:26px; background:#131119; border-radius:0 0 18px 18px; z-index:40}
.statusbar{height:46px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 26px 7px; font-size:13px; font-weight:600; flex:0 0 auto}
.statusbar .right{display:flex; gap:6px; align-items:center}
.screen{flex:1 1 auto; overflow-y:auto; overflow-x:hidden}
.screen::-webkit-scrollbar{width:0}

/* type + layout */
.pad{padding:6px 20px 28px}
.h1{font-size:23px; font-weight:700; letter-spacing:-.02em; margin:8px 0 4px}
.sub{color:var(--muted); font-size:14.5px; line-height:1.5; margin:0 0 18px}
.label{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow-card)}
.row{display:flex; align-items:center; gap:12px}
.spacer{flex:1}
.divider{height:1px; background:var(--border)}

/* icons */
.ic{display:inline-flex; align-items:center; justify-content:center; color:inherit; flex:0 0 auto}
.ic svg{display:block}

/* buttons */
.btn{font-family:var(--font); font-weight:600; font-size:16px; border:none; cursor:pointer; border-radius:12px; padding:15px 18px; width:100%; color:var(--btn-fg); background:var(--btn-bg); display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease, filter .12s ease}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn.secondary{background:var(--card); color:var(--text); border:1px solid var(--border)}
.btn.ghost{background:transparent; color:var(--violet); padding:10px}
.btn.danger{background:var(--danger); color:#fff}
.btn.sm{font-size:14px; padding:10px 14px; width:auto; border-radius:10px}

/* chips / segmented / badges */
.chip{display:inline-flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; padding:9px 13px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer}
.chip:active{background:var(--track)}
.seg{display:flex; gap:4px; background:var(--track); border-radius:12px; padding:4px; margin:2px 0 18px}
.seg button{flex:1; border:none; background:transparent; font-family:var(--font); font-weight:600; font-size:14px; color:var(--muted); padding:9px 8px; border-radius:9px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px}
.seg button.active{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(20,16,40,.10)}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; letter-spacing:.02em; padding:4px 8px; border-radius:8px}
.badge.best{background:var(--savings-tint); color:var(--savings)}
.badge.warn{background:var(--warn-tint); color:var(--warn)}
.badge.fail{background:var(--danger-tint); color:var(--danger)}
.badge.accent{background:var(--violet-tint); color:var(--violet)}

/* provider logo chip */
.plogo{border-radius:11px; display:grid; place-items:center; flex:0 0 auto; overflow:hidden}

/* fields */
.field{display:flex; align-items:center; gap:12px; padding:15px 14px; cursor:pointer}
.field .ic{color:var(--muted)}
.field .val{font-size:16px; font-weight:600; color:var(--text)}
.field .val.ph{color:#9b97ad; font-weight:500}
.trust{display:flex; gap:11px; align-items:flex-start; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:13px 14px; color:var(--muted); font-size:13px; font-weight:500; line-height:1.45}
.trust .ic{color:var(--savings); margin-top:1px}

/* list rows */
.lrow{display:flex; align-items:center; gap:13px; padding:15px 16px}
.lrow .nm{font-weight:600; font-size:15.5px}
.lrow .ds{color:var(--muted); font-size:13px; margin-top:1px}
.price{font-weight:700; font-size:20px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.price.lg{font-size:30px; font-weight:800}

/* steppers (grocery) */
.stepper{display:flex; align-items:center; gap:0; border:1px solid var(--border); border-radius:10px; overflow:hidden}
.stepper button{width:34px; height:34px; border:none; background:var(--card); color:var(--text); cursor:pointer; display:grid; place-items:center}
.stepper button:active{background:var(--track)}
.stepper .q{min-width:30px; text-align:center; font-weight:600; font-size:15px}

/* banner */
.banner{display:flex; gap:11px; align-items:center; background:var(--savings-tint); color:var(--savings); border-radius:14px; padding:14px 15px; font-weight:600; font-size:14px}
.banner.warn{background:var(--warn-tint); color:var(--warn)}

/* comparing */
.comparing{display:flex; align-items:center; gap:12px; padding:15px 16px}
.spinner{width:18px; height:18px; border-radius:50%; border:2.4px solid var(--border); border-top-color:var(--text); animation:spin .7s linear infinite; flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.fade{animation:fade .26s ease}
@keyframes fade{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}

/* empty state */
.empty{padding:46px 26px; text-align:center}
.empty .ic{color:var(--muted); margin-bottom:14px}
.empty .h{font-size:18px; font-weight:700; margin-bottom:6px}

/* tab bar */
.tabbar{flex:0 0 auto; display:flex; background:var(--card); border-top:1px solid var(--border); padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; border:none; background:none; font-family:var(--font); font-size:11px; font-weight:600; color:var(--muted); cursor:pointer}
.tab.active{color:var(--text)}

/* modals */
.backdrop{position:absolute; inset:0; background:rgba(15,11,30,.42); opacity:0; transition:opacity .2s; pointer-events:auto}
.backdrop.show{opacity:1}
.sheet{position:absolute; left:0; right:0; bottom:0; background:var(--card); border-radius:22px 22px 0 0; padding:10px 20px calc(22px + env(safe-area-inset-bottom)); box-shadow:var(--shadow-raised); transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.2,1); pointer-events:auto; max-height:92%; overflow-y:auto}
.sheet.show{transform:translateY(0)}
.grabber{width:40px; height:5px; border-radius:3px; background:var(--border); margin:6px auto 16px}
.dialog-wrap{position:absolute; inset:0; display:grid; place-items:center; padding:28px; pointer-events:none}
.dialog{width:100%; max-width:300px; background:var(--card); border-radius:16px; padding:22px 20px 16px; box-shadow:var(--shadow-raised); transform:scale(.92); opacity:0; transition:all .18s; pointer-events:auto}
.dialog.show{transform:scale(1); opacity:1}
.dialog.system{border:1px solid var(--border)}
.dialog h3{margin:0 0 8px; font-size:17.5px; font-weight:700}
.dialog p{margin:0 0 18px; color:var(--muted); font-size:14px; line-height:1.5}
.dialog .actions{display:flex; flex-direction:column; gap:8px}
.dialog .actions.horiz{flex-direction:row}
.dialog .actions.horiz .btn{flex:1}

/* checklist (connect) */
.step{display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border)}
.step:last-of-type{border-bottom:none}
.step .mk{width:26px; height:26px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center}
.mk.ok{background:var(--savings-tint); color:var(--savings)}
.mk.pending{background:var(--violet-tint); color:var(--violet)}
.mk.bad{background:var(--danger-tint); color:var(--danger)}
.step .t{font-weight:600; font-size:14.5px}
.step .d{color:var(--muted); font-size:12.5px}

/* toast */
.toasts{position:absolute; left:16px; right:16px; bottom:96px; z-index:70; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{display:flex; align-items:center; gap:9px; background:#211d33; color:#fff; font-weight:500; font-size:14px; padding:12px 15px; border-radius:12px; box-shadow:var(--shadow-raised); transform:translateY(10px); opacity:0; transition:all .22s}
.toast .ic{color:#cdbbff}
.toast.show{transform:translateY(0); opacity:1}
.toast.good{background:#0c7a5b} .toast.good .ic{color:#9af0d2}
.toast.bad{background:#b3261e} .toast.bad .ic{color:#ffc9c4}

/* CP2 components */
.tg{width:46px; height:28px; border-radius:999px; border:none; background:var(--border); position:relative; cursor:pointer; flex:0 0 auto; transition:background .18s}
.tg.on{background:var(--savings)}
.tg .knob{position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.22); transition:left .18s}
.tg.on .knob{left:21px}
.cbx{width:22px; height:22px; border-radius:6px; border:2px solid var(--border); display:grid; place-items:center; flex:0 0 auto; color:transparent}
.cbx.on{background:var(--violet); border-color:var(--violet); color:#fff}
.gbanner{display:flex; align-items:center; gap:9px; padding:9px 16px; font-size:13px; font-weight:600; background:var(--danger); color:#fff; flex:0 0 auto}
.gbanner .ic{color:#fff}
.stat{font-size:38px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.05; margin-top:2px}
.avatar{width:56px; height:56px; border-radius:50%; background:var(--violet); color:#fff; display:grid; place-items:center; font-weight:700; font-size:21px; flex:0 0 auto}
.intro-row{display:flex; gap:14px; align-items:flex-start; padding:13px 0}
.intro-row .ic{color:var(--violet); margin-top:2px}
.tierbar{display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; margin-bottom:2px}
.tierbar::-webkit-scrollbar{height:0}
.tierchip{flex:0 0 auto; border:1px solid var(--border); background:var(--card); color:var(--muted); font-family:var(--font); font-weight:600; font-size:13.5px; padding:8px 15px; border-radius:999px; cursor:pointer}
.tierchip.active{background:var(--btn-bg); color:var(--btn-fg); border-color:var(--btn-bg)}

/* map overlay */
.map{position:fixed; inset:0; background:rgba(14,11,28,.55); z-index:200; display:none; padding:30px; overflow:auto}
.map.show{display:block}
.map-inner{max-width:780px; margin:0 auto; background:#fff; border-radius:18px; padding:24px 26px}
.map h2{margin:0 0 4px} .map .muted{color:#6E6B7B; font-size:14px; margin:0 0 16px}
.map .grp{font-size:12px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#8a85a0; margin:18px 0 8px}
.map .node{display:inline-block; margin:4px 6px 4px 0; padding:8px 12px; border-radius:9px; border:1px solid #e5e2ef; font-weight:600; font-size:13px; color:#3a3454; background:#faf9fd}
.map .node.live{border-color:var(--violet); color:var(--violet); background:var(--violet-tint); cursor:pointer}
.map .node.todo{opacity:.5}
</style>
</head>
<body>
  <div class="toolbar">
    <span class="brand"><span id="brandmark"></span> Jedi <small>· interactive prototype</small></span>
    <select class="tbtn" id="jump" title="Jump to screen"></select>
    <button class="tbtn" data-tool="map">Flow map</button>
    <button class="tbtn" data-tool="alerts">Alerts</button>
    <button class="tbtn" data-tool="dark">Dark</button>
    <button class="tbtn" data-tool="reset">Reset</button>
  </div>

  <div class="stage">
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="statusbar"><span id="clock">9:41</span><span class="right" id="statusicons"></span></div>
      <div class="screen" id="screen"></div>
      <div class="tabbar" id="tabbar"></div>
      <div class="toasts" id="toasts"></div>
    </div>
  </div>

  <div class="map" id="map">
    <div class="map-inner">
      <div class="row"><h2 style="flex:1">Jedi: full screen inventory</h2><button class="tbtn" data-tool="map">Close</button></div>
      <p class="muted">Live screens are tappable. The rest arrive in Checkpoints 2 and 3 (full Mermaid flow map ships as <code>flow-map.md</code>).</p>
      <div id="map-body"></div>
    </div>
  </div>

<script>
/* ============================ icons ============================ */
const ICONS={
  locate:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  pin:'<path d="M12 21s-6-5.2-6-10a6 6 0 0 1 12 0c0 4.8-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>',
  chevronDown:'<path d="M6 9l6 6 6-6"/>',
  shield:'<path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3z"/><path d="M9.2 12l2 2 3.6-3.6"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  alert:'<path d="M12 4l9 16H3L12 4z"/><path d="M12 10v4M12 17.4v.2"/>',
  car:'<path d="M5 17v1.5M19 17v1.5"/><path d="M3.5 16v-3.2l1.7-4A2 2 0 0 1 7 7.5h10a2 2 0 0 1 1.8 1.3l1.7 4V16a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1z"/><path d="M3.8 12.8h16.4"/><circle cx="7.5" cy="16.7" r="1.2"/><circle cx="16.5" cy="16.7" r="1.2"/>',
  cart:'<circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M2.5 4H5l2.2 11a1.4 1.4 0 0 0 1.4 1.1h8.2a1.4 1.4 0 0 0 1.4-1.1L21 7.5H6"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/>',
  user:'<circle cx="12" cy="8.5" r="3.6"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>',
  sliders:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.1" fill="var(--card)"/><circle cx="15" cy="12" r="2.1" fill="var(--card)"/><circle cx="8" cy="17" r="2.1" fill="var(--card)"/>',
  arrow:'<path d="M5 12h13M13 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  minus:'<path d="M5 12h14"/>',
  bell:'<path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
  bolt:'<path d="M13 2L4 14h6l-1 8 9-12h-6z"/>',
  wallet:'<path d="M3 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M16 12.5h.01"/><path d="M3 8l13-2.6V8"/>',
  store:'<path d="M4 9.5 5.2 5h13.6L20 9.5M5 9.5V19h14V9.5M4 9.5h16"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-1.6 4.8M20 6v5h-5"/>',
  trendDown:'<path d="M4 7l6 6 4-4 6 6"/><path d="M16 17h4v-4"/>',
  lock:'<rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
  home:'<path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/>',
};
function icon(name,size=22,style=''){return el('span',{class:'ic',style:`width:${size}px;height:${size}px;${style}`,html:`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`});}

/* ============================ el helper ============================ */
function el(tag,attrs={},...kids){
  const n=document.createElement(tag);
  for(const k in attrs){
    if(k==='class') n.className=attrs[k];
    else if(k==='html') n.innerHTML=attrs[k];
    else if(k.startsWith('on')&&typeof attrs[k]==='function') n.addEventListener(k.slice(2),attrs[k]);
    else n.setAttribute(k,attrs[k]);
  }
  kids.flat().forEach(c=>{ if(c==null||c===false) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
}

/* ============================ modals ============================ */
function toast(msg,kind=''){
  const t=el('div',{class:'toast '+kind}, icon(kind==='good'?'check':kind==='bad'?'alert':'info',18), el('span',{},msg));
  document.getElementById('toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show'); setTimeout(()=>t.remove(),250);},2300);
}
function closeModal(wrap){
  const b=wrap.querySelector('.backdrop'); if(b) b.classList.remove('show');
  const p=wrap.querySelector('.sheet,.dialog'); if(p) p.classList.remove('show');
  setTimeout(()=>wrap.remove(),240);
}
function showAlert(opt){
  const wrap=el('div',{}); const back=el('div',{class:'backdrop'}); const host=el('div',{class:'dialog-wrap'});
  const horiz=opt.actions&&opt.actions.length===2;
  const dlg=el('div',{class:'dialog'+(opt.system?' system':'')});
  dlg.appendChild(el('h3',{},opt.title||''));
  if(opt.body) dlg.appendChild(el('p',{html:opt.body}));
  const acts=el('div',{class:'actions'+(horiz?' horiz':'')});
  (opt.actions||[{label:'OK',kind:'primary'}]).forEach(a=>{
    const b=el('button',{class:'btn '+(a.kind==='primary'?'':(a.kind||'secondary'))+' sm',style:'width:100%'},a.label);
    b.addEventListener('click',()=>{ if(a.close!==false) closeModal(wrap); if(a.onClick) a.onClick(); });
    acts.appendChild(b);
  });
  dlg.appendChild(acts); host.appendChild(dlg); wrap.appendChild(back); wrap.appendChild(host);
  document.getElementById('phone').appendChild(wrap);
  requestAnimationFrame(()=>{back.classList.add('show'); dlg.classList.add('show');});
  return wrap;
}
function showSheet(opt){
  const wrap=el('div',{}); const back=el('div',{class:'backdrop'}); const sheet=el('div',{class:'sheet'});
  sheet.appendChild(el('div',{class:'grabber'}));
  if(opt.title) sheet.appendChild(el('div',{style:'font-size:19px;font-weight:700;margin:0 0 14px'},opt.title));
  const close=()=>closeModal(wrap); back.addEventListener('click',close);
  if(opt.build) opt.build(sheet,close);
  wrap.appendChild(back); wrap.appendChild(sheet);
  document.getElementById('phone').appendChild(wrap);
  requestAnimationFrame(()=>{back.classList.add('show'); sheet.classList.add('show');});
  return {wrap,sheet,close};
}

function connectFlow(id){
  const p=LOGOS[id];
  showSheet({title:'Connect '+p.name, build:(sheet,close)=>{
    const list=el('div',{});
    const step=(mk,cls,t,d,action)=>{ const s=el('div',{class:'step'}); s.appendChild(el('div',{class:'mk '+cls},icon(mk,16))); const tx=el('div',{style:'flex:1'}); tx.appendChild(el('div',{class:'t'},t)); tx.appendChild(el('div',{class:'d'},d)); s.appendChild(tx); if(action) s.appendChild(action); return s; };
    if(p.installed){ list.appendChild(step('check','ok',p.name+' is installed','Found on your device')); }

/* ---------- global alerts / system states ---------- */
const ALERTS={

  sessionExpired:()=>showAlert({title:'Session expired',body:'For your security, please sign in again.',actions:[{label:'Sign in',kind:'primary',onClick:()=>{ state.signedIn=false; navigate('signin'); }}]}),
  loginExpired:()=>showAlert({title:'Uber sign-in expired',body:'Open Uber and sign in again so Jedi can keep reading its prices.',actions:[{label:'Later',kind:'secondary'},{label:'Reconnect',kind:'primary',onClick:()=>connectFlow('uber')}]}),
  accessRevoked:()=>showAlert({system:true,title:'Accessibility turned off',body:'Jedi’s Accessibility permission was turned off, so it can’t read prices. Re-enable it to keep comparing.',actions:[{label:'Not now',kind:'secondary'},{label:'Open settings',kind:'primary',onClick:()=>toast('Opening Accessibility settings…')}]}),
  forceUpdate:()=>showAlert({title:'Update required',body:'A new version of Jedi is required to keep going.',actions:[{label:'Update now',kind:'primary',onClick:()=>toast('Opening App Store…')}]}),

/* ============================ router + chrome ============================ */
const TABS=[{id:'home',label:'Home',icon:'home'},{id:'earn',label:'Earn',icon:'bolt'},{id:'account',label:'Account',icon:'user'}];
function renderTabbar(){
  const bar=document.getElementById('tabbar'); const at=screens[state.screen].tab;
  if(!at){ bar.style.display='none'; return; }
  bar.style.display='flex'; bar.innerHTML='';
  TABS.forEach(t=>{ const b=el('button',{class:'tab'+(t.id===at?' active':'')}, icon(t.icon,22), t.label); b.addEventListener('click',()=>navigate(t.id==='home'?'home':t.id)); bar.appendChild(b); });
}
function renderScreen(){ const s=screens[state.screen]; const scr=document.getElementById('screen'); scr.innerHTML=''; scr.scrollTop=0; if(state.offline) scr.appendChild(el('div',{class:'gbanner'}, icon('alert',16), 'No internet connection, showing last known prices')); scr.appendChild(s.render()); renderTabbar(); syncJump(); }
function navigate(id){ if(!screens[id]) return; state.screen=id;
  if(id==='splash'){ renderScreen(); setTimeout(()=>{ if(state.screen==='splash') navigate('intro'); },1300); return; }
  if(id==='results'){ state.resultsPhase='loading'; renderScreen(); setTimeout(()=>{ if(state.screen==='results'){ state.resultsPhase='loaded'; renderScreen(); } },1300); return; }
  renderScreen();
}

  if(t==='reset'){ state.connected.rides.clear(); state.connected.grocery.clear(); state.to=''; state.basket=DEFAULT_BASKET.map(x=>({...x})); state.category='rides'; navigate('connect'); toast('Prototype reset'); }
  if(t==='map'){ document.getElementById('map').classList.toggle('show'); }
  if(t==='alerts'){ alertsMenu(); }
});
